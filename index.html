
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>White-Label Wonder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: { // Violet
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
                950: '#2e1065',
              },
              secondary: { // Teal
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              },
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
              },
              gray: {
                50: '#f9fafb',
                100: '#f3f4f6',
                200: '#e5e7eb',
                300: '#d1d5db',
                400: '#9ca3af',
                500: '#6b7280',
                600: '#4b5563',
                700: '#374151',
                800: '#1f2937',
                900: '#111827',
                950: '#030712'
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'orange-gradient': 'linear-gradient(to right, #FF4B1F, #FF6B00)',
            },
            keyframes: {
              'scale-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'fade-in-up': {
                  '0%': { opacity: '0', transform: 'translateY(10px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
              },
               'fade-in-down': {
                  '0%': { opacity: '0', transform: 'translateY(-10px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'blob-1': {
                  '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                  '25%': { transform: 'translate(20vw, -10vh) scale(1.1)' },
                  '50%': { transform: 'translate(0, 20vh) scale(0.9)' },
                  '75%': { transform: 'translate(-20vw, -10vh) scale(1.1)' },
              },
              'blob-2': {
                  '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                  '25%': { transform: 'translate(-15vw, 15vh) scale(1.1)' },
                  '50%': { transform: 'translate(10vw, 0) scale(0.9)' },
                  '75%': { transform: 'translate(5vw, -15vh) scale(1.1)' },
              },
              'shimmer': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              'pulse-subtle': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.8' }
              }
            },
            animation: {
              'scale-in': 'scale-in 0.2s ease-out',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'fade-in-down': 'fade-in-down 0.3s ease-out forwards',
              'blob-1': 'blob-1 30s infinite ease-in-out',
              'blob-2': 'blob-2 25s infinite ease-in-out',
              'shimmer': 'shimmer 2s infinite',
              'pulse-subtle': 'pulse-subtle 2s ease-in-out infinite',
            },
          },
        },
      };
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "types": "https://aistudiocdn.com/types@^0.1.1"
  }
}
</script>
</head>
  <body class="bg-gray-950 text-slate-300 antialiased relative overflow-x-hidden">
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      * {
        scroll-behavior: smooth;
      }
    </style>
    <div class="absolute top-0 left-0 w-full h-full -z-10 overflow-hidden">
      <div class="absolute -top-1/4 -left-1/4 w-[50rem] h-[50rem] bg-primary-500/15 rounded-full filter blur-3xl opacity-50 animate-blob-1"></div>
      <div class="absolute -bottom-1/4 -right-1/4 w-[50rem] h-[50rem] bg-secondary-500/15 rounded-full filter blur-3xl opacity-50 animate-blob-2"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
